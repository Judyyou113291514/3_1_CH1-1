<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物觀察配對遊戲</title>
<style>
    body { font-family: '微軟正黑體', sans-serif; background-color: #e8f5e9; color: #2e7d32; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
    h1 { color: #33691e; margin-bottom: 5px; }
    p.subtitle { color: #558b2f; margin-top: 0; margin-bottom: 20px; font-weight: bold; }
    .status-board { display: flex; gap: 20px; font-size: 1.2em; font-weight: bold; background: #fff; padding: 10px 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 800px; width: 100%; }
    @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .card { background-color: #aed581; height: 120px; border-radius: 10px; display: flex; justify-content: center; align-items: center; text-align: center; padding: 15px; font-size: 1.1em; font-weight: bold; color: transparent; cursor: pointer; transition: transform 0.3s, background-color 0.3s; box-shadow: 0 4px 8px rgba(0,0,0,0.1); user-select: none; }
    .card.flipped { background-color: #ffffff; color: #1b5e20; transform: rotateY(0deg); cursor: default; border: 3px solid #7cb342; }
    .card.matched { background-color: #c8e6c9; color: #1b5e20; border: 3px solid #388e3c; opacity: 0.8; cursor: default; }
    
    .btn { background-color: #ff9800; color: white; border: none; padding: 12px 24px; font-size: 1.1em; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 30px; display: none; }
    .btn:hover { background-color: #f57c00; }
</style>
</head>
<body>

<h1>🌿 植物觀察配對任務</h1>
<p class="subtitle">找出「觀察方法」與對應的「植物」！</p>

<div class="status-board">
    <span>翻牌次數: <span id="moves">0</span></span>
    <span>完成配對: <span id="matches">0</span> / 10</span>
</div>

<div class="grid" id="gameBoard"></div>

<button class="btn" id="restartBtn" onclick="initGame()">🔄 再玩一次</button>

<script>
    const pairsData = [
        { id: 1, action: "✋ 觸摸：輕碰葉片，觀察是否會閉合下垂", plant: "含羞草" },
        { id: 2, action: "👀 觀察：找找看葉子末端有沒有「捕蟲籠」", plant: "豬籠草" },
        { id: 3, action: "👀 觀察：尋找樹枝上垂掛下來的長長「氣根」", plant: "榕樹" },
        { id: 4, action: "✋ 觸摸：輕捏葉柄，感覺裡面是否有海綿狀的氣室", plant: "布袋蓮" },
        { id: 5, action: "👀 觀察：水面上的葉子邊緣有沒有「V字型缺口」", plant: "睡蓮" },
        { id: 6, action: "💧 滴水：滴水在葉片上，觀察細毛是否會讓水珠滾動", plant: "大萍" },
        { id: 7, action: "👀 觀察：尋找莖部異常肥厚且長滿尖刺的植物", plant: "仙人掌" },
        { id: 8, action: "👀 觀察：秋天時，樹上是否有像紅色小燈籠的果實", plant: "臺灣欒樹" },
        { id: 9, action: "👀 觀察：尋找攀爬在欄杆上的「漏斗狀」花朵", plant: "牽牛花" },
        { id: 10, action: "👀 觀察：花序非常巨大，且有明顯的鮮黃色花瓣", plant: "向日葵" }
    ];

    let cardsArray = [];
    let firstCard = null;
    let secondCard = null;
    let moves = 0;
    let matches = 0;
    let lockBoard = false;

    function initGame() {
        const gameBoard = document.getElementById("gameBoard");
        gameBoard.innerHTML = "";
        moves = 0;
        matches = 0;
        document.getElementById("moves").innerText = moves;
        document.getElementById("matches").innerText = matches;
        document.getElementById("restartBtn").style.display = "none";
        cardsArray = [];

        // 拆分資料成為獨立卡片
        pairsData.forEach(pair => {
            cardsArray.push({ id: pair.id, text: pair.action, type: 'action' });
            cardsArray.push({ id: pair.id, text: pair.plant, type: 'plant' });
        });

        // 隨機打亂卡片
        cardsArray.sort(() => 0.5 - Math.random());

        // 生成卡片 HTML
        cardsArray.forEach((card, index) => {
            const cardElement = document.createElement("div");
            cardElement.classList.add("card");
            cardElement.dataset.id = card.id;
            cardElement.dataset.index = index;
            cardElement.innerText = card.text;
            cardElement.addEventListener("click", flipCard);
            gameBoard.appendChild(cardElement);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add("flipped");

        if (!firstCard) {
            firstCard = this;
            return;
        }

        secondCard = this;
        lockBoard = true;
        moves++;
        document.getElementById("moves").innerText = moves;

        checkForMatch();
    }

    function checkForMatch() {
        const isMatch = firstCard.dataset.id === secondCard.dataset.id;
        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.removeEventListener("click", flipCard);
        secondCard.removeEventListener("click", flipCard);
        
        matches++;
        document.getElementById("matches").innerText = matches;
        resetBoard();

        if (matches === pairsData.length) {
            setTimeout(() => {
                alert(`🎉 恭喜過關！你總共用了 ${moves} 步完成所有植物觀察配對！`);
                document.getElementById("restartBtn").style.display = "block";
            }, 500);
        }
    }

    function unflipCards() {
        setTimeout(() => {
            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");
            resetBoard();
        }, 1200);
    }

    function resetBoard() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    initGame();
</script>
</body>
</html>
