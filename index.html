<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物觀察特訓與配對</title>
<style>
    body { font-family: '微軟正黑體', sans-serif; background-color: #e8f5e9; color: #2e7d32; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
    h1 { color: #33691e; margin-top: 0; margin-bottom: 5px; font-size: 2em; text-align: center; }
    p.subtitle { color: #558b2f; margin-top: 0; margin-bottom: 15px; font-weight: bold; text-align: center; }
    
    /* 容器設定：確保切換時版面置中 */
    .screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1000px; }
    #gameScreen { display: none; } /* 初始隱藏遊戲區 */

    /* 圖鑑區樣式 */
    .intro-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-bottom: 25px; }
    .intro-card { background: white; padding: 12px 15px; border-left: 6px solid #7cb342; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .intro-card .plant-name { font-size: 1.2em; font-weight: bold; color: #1b5e20; margin-bottom: 5px; }
    .intro-card .plant-action { font-size: 1em; color: #424242; }

    /* 遊戲區樣式 */
    .status-board { display: flex; gap: 30px; font-size: 1.2em; font-weight: bold; background: #fff; padding: 8px 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
    
    /* 5x4 版面配置，縮減間距與卡片高度避免滑動 */
    .game-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 1000px; }
    
    .card { background-color: #aed581; height: 11vh; min-height: 80px; max-height: 110px; border-radius: 8px; display: flex; justify-content: center; align-items: center; text-align: center; padding: 8px; font-size: 0.95em; font-weight: bold; color: transparent; cursor: pointer; transition: transform 0.3s, background-color 0.3s; box-shadow: 0 3px 6px rgba(0,0,0,0.1); user-select: none; line-height: 1.3; }
    .card.flipped { background-color: #ffffff; color: #1b5e20; transform: rotateY(0deg); cursor: default; border: 2px solid #7cb342; }
    .card.matched { background-color: #c8e6c9; color: #1b5e20; border: 2px solid #388e3c; opacity: 0.7; cursor: default; }
    
    /* 按鈕樣式 */
    .btn { background-color: #ff9800; color: white; border: none; padding: 12px 28px; font-size: 1.2em; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn:hover { background-color: #f57c00; transform: scale(1.05); }
    .btn-secondary { background-color: #7cb342; margin-top: 15px; display: none; }
    .btn-secondary:hover { background-color: #689f38; }

    /* 響應式：若螢幕真的太小（如直立手機），退回 4 欄或 2 欄 */
    @media (max-width: 800px) {
        .game-grid { grid-template-columns: repeat(4, 1fr); }
        .intro-grid { grid-template-columns: 1fr; }
        .card { height: 80px; font-size: 0.85em; }
    }
</style>
</head>
<body>

<!-- 第一階段：圖鑑學習區 -->
<div id="introScreen" class="screen">
    <h1>🌱 植物觀察特訓班</h1>
    <p class="subtitle">出發尋找植物前，先來認識這 10 種植物的「專屬觀察重點」！</p>
    
    <div class="intro-grid" id="introGridContainer">
        <!-- 圖鑑卡片將由 JS 自動生成 -->
    </div>
    
    <button class="btn" onclick="startGame()">🚀 特訓完成，進入配對挑戰！</button>
</div>

<!-- 第二階段：遊戲挑戰區 -->
<div id="gameScreen" class="screen">
    <h1>🌿 植物觀察配對任務</h1>
    <p class="subtitle">請翻出「植物名稱」與對應的「觀察重點」</p>

    <div class="status-board">
        <span>翻牌步數: <span id="moves">0</span></span>
        <span>配對成功: <span id="matches">0</span> / 10</span>
    </div>

    <!-- 5x4 的遊戲棋盤 -->
    <div class="game-grid" id="gameBoard"></div>

    <button class="btn btn-secondary" id="restartBtn" onclick="backToIntro()">🔄 再次複習與挑戰</button>
</div>

<script>
    const pairsData = [
        { id: 1, action: "✋ 觸摸：輕碰葉片，觀察是否會閉合下垂", plant: "含羞草" },
        { id: 2, action: "👀 觀察：找找看葉子末端有沒有「捕蟲籠」", plant: "豬籠草" },
        { id: 3, action: "👀 觀察：尋找樹枝上垂掛下來的長長「氣根」", plant: "榕樹" },
        { id: 4, action: "✋ 觸摸：輕捏葉柄，感覺裡面是否有海綿狀的氣室", plant: "布袋蓮" },
        { id: 5, action: "👀 觀察：水面上的葉子邊緣有沒有「V字型缺口」", plant: "睡蓮" },
        { id: 6, action: "💧 滴水：滴水在葉片上，觀察細毛是否會讓水珠滾動", plant: "大萍" },
        { id: 7, action: "👀 觀察：尋找莖部異常肥厚且長滿尖刺的植物", plant: "仙人掌" },
        { id: 8, action: "👀 觀察：秋天時，樹上是否有像紅色小燈籠的果實", plant: "臺灣欒樹" },
        { id: 9, action: "👀 觀察：尋找攀爬在欄杆上的「漏斗狀」花朵", plant: "牽牛花" },
        { id: 10, action: "👀 觀察：花序非常巨大，且有明顯的鮮黃色花瓣", plant: "向日葵" }
    ];

    let cardsArray = [];
    let firstCard = null;
    let secondCard = null;
    let moves = 0;
    let matches = 0;
    let lockBoard = false;

    // 1. 初始化圖鑑區
    function renderIntro() {
        const container = document.getElementById("introGridContainer");
        container.innerHTML = "";
        pairsData.forEach(pair => {
            container.innerHTML += `
                <div class="intro-card">
                    <div class="plant-name">🌿 ${pair.plant}</div>
                    <div class="plant-action">${pair.action}</div>
                </div>
            `;
        });
    }

    // 2. 切換畫面並開始遊戲
    function startGame() {
        document.getElementById("introScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "flex";
        initGame();
    }

    // 回到圖鑑區
    function backToIntro() {
        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("introScreen").style.display = "flex";
        document.getElementById("restartBtn").style.display = "none";
    }

    // 3. 遊戲初始化邏輯
    function initGame() {
        const gameBoard = document.getElementById("gameBoard");
        gameBoard.innerHTML = "";
        moves = 0;
        matches = 0;
        document.getElementById("moves").innerText = moves;
        document.getElementById("matches").innerText = matches;
        document.getElementById("restartBtn").style.display = "none";
        cardsArray = [];

        // 拆分資料成為 20 張獨立卡片
        pairsData.forEach(pair => {
            cardsArray.push({ id: pair.id, text: pair.action, type: 'action' });
            cardsArray.push({ id: pair.id, text: pair.plant, type: 'plant' });
        });

        // 隨機洗牌
        cardsArray.sort(() => 0.5 - Math.random());

        // 生成卡片 HTML
        cardsArray.forEach((card, index) => {
            const cardElement = document.createElement("div");
            cardElement.classList.add("card");
            cardElement.dataset.id = card.id;
            cardElement.dataset.index = index;
            cardElement.innerText = card.text;
            cardElement.addEventListener("click", flipCard);
            gameBoard.appendChild(cardElement);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add("flipped");

        if (!firstCard) {
            firstCard = this;
            return;
        }

        secondCard = this;
        lockBoard = true;
        moves++;
        document.getElementById("moves").innerText = moves;

        checkForMatch();
    }

    function checkForMatch() {
        const isMatch = firstCard.dataset.id === secondCard.dataset.id;
        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.removeEventListener("click", flipCard);
        secondCard.removeEventListener("click", flipCard);
        
        matches++;
        document.getElementById("matches").innerText = matches;
        resetBoard();

        // 完成所有配對
        if (matches === pairsData.length) {
            setTimeout(() => {
                alert(`🎉 太厲害了！你用了 ${moves} 步完成所有特訓，現在帶著學習單出發去校園找植物吧！`);
                document.getElementById("restartBtn").style.display = "block";
            }, 500);
        }
    }

    function unflipCards() {
        setTimeout(() => {
            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");
            resetBoard();
        }, 1200);
    }

    function resetBoard() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    // 網頁載入時先渲染圖鑑
    renderIntro();
</script>
</body>
</html>
