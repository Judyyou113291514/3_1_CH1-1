<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物猜猜我是誰 - 計分挑戰版</title>
<style>
    body { font-family: '微軟正黑體', sans-serif; background-color: #f1f8e9; color: #33691e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .game-board { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; position: relative; }
    .score-board { position: absolute; top: 20px; right: 25px; font-size: 1.2em; font-weight: bold; background: #ffca28; padding: 8px 15px; border-radius: 20px; color: #5d4037; }
    h1 { margin-top: 10px; color: #558b2f; font-size: 1.8em; }
    .progress { font-size: 0.9em; color: #7cb342; margin-bottom: 15px; }
    .clue-box { background: #dcedc8; min-height: 100px; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; font-size: 1.1em; line-height: 1.6; }
    .plant-image { width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; display: none; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .btn { background-color: #7cb342; color: white; border: none; padding: 12px; font-size: 1.1em; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .btn:hover { background-color: #689f38; }
    .btn:disabled { background-color: #c5e1a5; cursor: not-allowed; }
    .action-btn { background-color: #ff9800; }
    .action-btn:hover { background-color: #f57c00; }
    #message { font-size: 1.2em; font-weight: bold; margin-top: 15px; min-height: 30px; }
    .correct { color: #2e7d32; }
    .wrong { color: #c62828; }
</style>
</head>
<body>

<div class="game-board">
    <div class="score-board">分數: <span id="scoreDisplay">0</span></div>
    <h1>🌱 植物猜猜我是誰</h1>
    <div class="progress" id="progressDisplay">題目: 1 / 10</div>
    
    <img id="plantImg" class="plant-image" src="" alt="植物圖片">
    <div class="clue-box" id="clueDisplay">點擊下方按鈕獲取第一個提示！</div>
    
    <button class="btn action-btn" id="nextClueBtn" onclick="showNextClue()">🔍 給我一個提示</button>
    
    <div class="options" id="optionsContainer" style="display: none; margin-top: 20px;"></div>
    
    <div id="message"></div>
    <button class="btn action-btn" id="nextPlantBtn" onclick="nextQuestion()" style="display: none; margin-top: 10px;">➡️ 下一題</button>
</div>

<script>
    const plantsData = [
        { name: "向日葵", img: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/87710310-4057-575b-ab48-124da79c4884/2fdf7415-58ca-5674-a205-fcefffcee2a0.jpg", clues: ["我的花序會跟著太陽轉動。", "我的花瓣是鮮黃色的，非常顯眼。", "我結出的種子可以炒來吃，叫做「瓜子」。"] },
        { name: "榕樹", img: "https://upload.wikimedia.org/wikipedia/commons/8/82/Ficus_microcarpa_leaves_and_fruits.jpg", clues: ["我是一棵高大的樹，常出現在校園裡。", "我的葉子是橢圓形的，表面綠綠亮亮的。", "我的樹枝上會長出很多長長的「鬍鬚」（氣根）。"] },
        { name: "含羞草", img: "https://st.perplexity.ai/estatic/0b226c450798410ac541646c86ec31afd840e5beab817a5d84fa821e7db61981ec84c3b4a3f072a7a2e1899c9fb06c6ef7b192ddc2f6621970bdbfed44614918a0ec5516ae9e079aae8a22ebc15b0c636f7a40c2513e486f4ccecfb99539d5090491ab525bf73729ab02faf195a4efc6", clues: ["我的葉子是羽毛狀的排列。", "我開的花像粉紅色的小絨球。", "如果你的手碰到我，我的葉子會馬上閉合下垂！"] },
        { name: "豬籠草", img: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/159727e6-06b2-5719-80d4-85adf0ea4548/b8082786-a487-52ff-ba65-f8daadc3cfef.jpg", clues: ["我生長在土壤養分很少的地方。", "我的葉子末端會長出一個像瓶子一樣的構造。", "我會分泌蜜汁吸引昆蟲掉進來，消化牠們補充營養！"] },
        { name: "睡蓮", img: "https://upload.wikimedia.org/wikipedia/commons/4/4f/Nymphaea_alba_1.jpg", clues: ["我是一種生長在水裡的「浮水植物」。", "我的葉子有一個 V 字型的缺口，平貼在水面上。", "我的花白天會打開，到了晚上就會閉合起來。"] },
        { name: "臺灣欒樹", img: "https://upload.wikimedia.org/wikipedia/commons/8/84/Koelreuteria_elegans_subsp._formosana_01.jpg", clues: ["我是台灣特有的植物，常被種在馬路邊當行道樹。", "秋天時，我會開出黃色的花朵。", "花謝後，會結出像紅色小燈籠一樣的果實（蒴果）。"] },
        { name: "仙人掌", img: "https://upload.wikimedia.org/wikipedia/commons/7/7b/Opuntia_ficus-indica_1.jpg", clues: ["我通常住在很熱、很少下雨的沙漠裡。", "我的莖很肥厚，裡面可以儲存很多水分。", "為了減少水分流失，我的葉子退化成尖尖的刺！"] },
        { name: "布袋蓮", img: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/28b320c6-aea8-58bd-916d-4d41e16f77f5/51e7eb76-e93f-5be1-ac0e-d17677e320ff.jpg", clues: ["我是一種漂浮在水面上的植物。", "我會開出美麗的淡紫色花朵。", "我的葉柄膨大像海綿一樣，裡面有氣室可以幫助我浮在水上。"] },
        { name: "牽牛花", img: "https://upload.wikimedia.org/wikipedia/commons/8/85/Ipomoea_purpurea_flowers.jpg", clues: ["我有細長的蔓性莖，會攀爬在欄杆或籬笆上。", "我的花朵長得像一個小喇叭。", "我通常在清晨開花，到了中午就會慢慢閉合。"] },
        { name: "大萍", img: "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/ac6729ea-37fd-5ad9-9500-1fdaeb70f538/0af98422-8d5d-5204-9f00-361f34eddb23.jpg", clues: ["我生長在水面上，是一種漂浮植物。", "我的葉子表面有許多細毛，可以防水。", "我的外觀長得就像一朵漂在水上的綠色高麗菜（又叫水芙蓉）。"] }
    ];

    let currentPlantIndex = 0;
    let currentClueIndex = 0;
    let score = 0;
    let shuffledPlants = [];
    let currentOptions = [];

    function initGame() {
        shuffledPlants = plantsData.sort(() => 0.5 - Math.random());
        loadQuestion();
    }

    function loadQuestion() {
        currentClueIndex = 0;
        document.getElementById("progressDisplay").innerText = `題目: ${currentPlantIndex + 1} / 10`;
        document.getElementById("clueDisplay").innerHTML = "準備好猜測了嗎？";
        document.getElementById("message").innerText = "";
        document.getElementById("nextClueBtn").style.display = "inline-block";
        document.getElementById("nextClueBtn").disabled = false;
        document.getElementById("nextClueBtn").innerText = "🔍 給我第一個提示 (答對得10分)";
        document.getElementById("optionsContainer").style.display = "none";
        document.getElementById("nextPlantBtn").style.display = "none";
        document.getElementById("plantImg").style.display = "none";
        
        generateOptions();
    }

    function showNextClue() {
        const plant = shuffledPlants[currentPlantIndex];
        if (currentClueIndex < plant.clues.length) {
            let cluesHtml = "";
            for (let i = 0; i <= currentClueIndex; i++) {
                cluesHtml += `• ${plant.clues[i]}<br>`;
            }
            document.getElementById("clueDisplay").innerHTML = cluesHtml;
            currentClueIndex++;
            document.getElementById("optionsContainer").style.display = "grid";
        }
        
        const btn = document.getElementById("nextClueBtn");
        if (currentClueIndex === 1) btn.innerText = "🔍 給我第二個提示 (答對得5分)";
        else if (currentClueIndex === 2) btn.innerText = "🔍 給我最後提示 (答對得2分)";
        else if (currentClueIndex === 3) {
            btn.disabled = true;
            btn.innerText = "提示發放完畢";
        }
    }

    function generateOptions() {
        const correctName = shuffledPlants[currentPlantIndex].name;
        let wrongOptions = plantsData.filter(p => p.name !== correctName).sort(() => 0.5 - Math.random()).slice(0, 3).map(p => p.name);
        currentOptions = [correctName, ...wrongOptions].sort(() => 0.5 - Math.random());
        
        const optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = "";
        
        currentOptions.forEach(option => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = option;
            btn.onclick = () => checkAnswer(option, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, btnElement) {
        const plant = shuffledPlants[currentPlantIndex];
        const correct = plant.name;
        const msgElement = document.getElementById("message");
        
        if (selected === correct) {
            let points = 0;
            if (currentClueIndex === 1) points = 10;
            else if (currentClueIndex === 2) points = 5;
            else if (currentClueIndex === 3) points = 2;
            
            score += points;
            document.getElementById("scoreDisplay").innerText = score;
            
            msgElement.innerHTML = `✅ 答對了！獲得 ${points} 分！就是 <b>${correct}</b>！`;
            msgElement.className = "correct";
            
            document.getElementById("plantImg").src = plant.img;
            document.getElementById("plantImg").style.display = "block";
            let fullClues = "";
            plant.clues.forEach(c => fullClues += `• ${c}<br>`);
            document.getElementById("clueDisplay").innerHTML = fullClues;
            
            document.getElementById("nextClueBtn").style.display = "none";
            const allBtns = document.getElementById("optionsContainer").querySelectorAll("button");
            allBtns.forEach(b => b.disabled = true);
            btnElement.style.backgroundColor = "#ff9800";
            
            document.getElementById("nextPlantBtn").style.display = "inline-block";
        } else {
            msgElement.innerText = "❌ 不對喔，分數扣 1 分，請繼續嘗試！";
            msgElement.className = "wrong";
            score = Math.max(0, score - 1);
            document.getElementById("scoreDisplay").innerText = score;
            btnElement.disabled = true;
        }
    }

    function nextQuestion() {
        currentPlantIndex++;
        if (currentPlantIndex >= shuffledPlants.length) {
            document.getElementById("clueDisplay").innerHTML = `🎉 遊戲結束！你的總得分是：<b>${score} 分</b>`;
            document.getElementById("plantImg").style.display = "none";
            document.getElementById("optionsContainer").style.display = "none";
            document.getElementById("nextPlantBtn").style.display = "none";
            document.getElementById("progressDisplay").style.display = "none";
            document.getElementById("message").innerText = "";
        } else {
            loadQuestion();
        }
    }

    initGame();
</script>
</body>
</html>
